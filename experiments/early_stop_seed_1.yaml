# Run-to-run variance under early stopping: early_stop retrained with another seed.
# The spread of early_stop, early_stop_seed_1 and early_stop_seed_2 is the noise
# floor that account_order, pretrain_on_test, text and MLM must beat.
base: early_stop.yaml
name: early_stop_seed_1
description: early_stop, seed 1 (pretraining and XGBoost)
training:
  rng.seed: 1
xgboost:
  random_state: 1
