# Early stopping with the large model (~88M weights): see early_stop.yaml.
base: early_stop.yaml
name: early_stop_large
description: model_large trained until the validation loss stops improving (ceiling 20000 steps)
training:
  model.config.hidden_size: 768
  model.config.num_hidden_layers: 12
  model.config.num_attention_heads: 12
  model.config.num_key_value_heads: 4
  model.config.intermediate_size: 2048
