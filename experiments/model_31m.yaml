# Model size: the former base (~31M weights, 512 wide, 8 layers; the size in
# configs/pretrain_bank_decoder.yaml). Does a bigger model than the tiny base help?
base: base.yaml
name: model_31m
description: base with the former base model (512 wide, 8 layers, ~31M weights)
training:
