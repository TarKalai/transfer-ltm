# Run-to-run variance: base retrained with another seed. The spread of base,
# seed_1 and seed_2 is the noise floor any strategy must beat (beyond the
# test-sampling error that auc_se already measures).
base: base.yaml
name: seed_1
description: base, seed 1 (pretraining and XGBoost)
training:
  rng.seed: 1
xgboost:
  random_state: 1
